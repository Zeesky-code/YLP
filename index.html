<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yorùbá Learning Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Yorùbá Tone Practice</h1>
        
        <div id="word-display">
            <h2 id="current-word">baba</h2>
            <p>Meaning: <span id="word-meaning">father</span></p>
        </div>

        <div class="practice-area">
            <input type="text" id="user-input" placeholder="Type the word with correct tones">
            <button id="play-audio">Play Sound</button>
            <button id="check-answer">Check Answer</button>
        </div>

        <div id="feedback"></div>
        <div id="score">Score: 0</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
